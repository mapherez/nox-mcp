name: Release

on:
  workflow_run:
    workflows: ['Supported / Required compatibility']
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: nox-release-publication
  cancel-in-progress: false

jobs:
  release:
    # Successful PR/fork/manual runs and ordinary master commits never publish.
    if: >-
      github.repository == 'mapherez/nox-mcp' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify approved SHA and 17 jobs, package and publish last
        run: node scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
