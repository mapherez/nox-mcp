name: Release

on:
  workflow_run:
    workflows: ["Supported / Required compatibility"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: nox-release-publication
  cancel-in-progress: false

jobs:
  release:
    # Successful PR/fork/manual runs and ordinary master commits never publish.
    if: >-
      github.repository == 'mapherez/nox-mcp' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Reuse the complete source compatibility matrix
        id: approval
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireApprovedCI } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-policy.mjs`).href);
            const approval = await requireApprovedCI({ github, ...context.repo, revision: context.payload.workflow_run.head_sha });
            core.setOutput('run_id', String(approval.runId));
            core.notice(`Reusing source CI ${approval.runId}; no compatibility tests are repeated.`);
      - name: Verify approved source matrix, package and publish last
        run: node scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_CI_RUN: ${{ steps.approval.outputs.run_id }}
