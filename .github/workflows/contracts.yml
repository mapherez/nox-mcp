name: Supported / Required compatibility

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Supported / Required conformance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Reject generated contract drift
        run: npm run contracts:check
      - name: Test TypeScript contracts and existing behavior
        run: npm test
      - name: Test Go contracts and existing behavior
        run: go test -mod=readonly ./...
      - name: Test Rust contracts and existing behavior
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Compare actual runtime observations across languages
        run: npm run test:conformance
      - name: Measure conventional and incremental discovery payloads
        run: npm run benchmark:discovery
      - name: Verify standalone native dependencies
        run: npm run test:native-packages
      - name: Verify installed TypeScript package
        run: npm run package:check
      - name: Require stdio and HTTP JSON in all SDKs, plus SSE in TypeScript/Rust
        run: npm run test:discovery

  independent-consumers:
    name: Supported / Required consumer / ${{ matrix.language }} / ${{ matrix.profile }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [minimum, latest]
        language: [rust, go, typescript]
        include:
          - os: macos-latest
            profile: latest
            language: rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.profile == 'minimum' && '24.0.0' || '24' }}
          cache: npm
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: ${{ matrix.profile == 'minimum' && '1.26.0' || '1.26.x' }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
        with:
          toolchain: ${{ matrix.profile == 'minimum' && '1.88.0' || 'stable' }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compile and execute independent native application
        if: matrix.language != 'typescript'
        run: node scripts/check-consumers.mjs
        env:
          NOX_CONSUMER_LANGUAGE: ${{ matrix.language }}
          NOX_CONSUMER_PROFILE: ${{ matrix.profile }}
      - name: Install tarball, compile consuming TS app and test HTTP JSON/SSE
        if: matrix.language == 'typescript'
        run: npm run package:check
        env:
          NOX_CONSUMER_PROFILE: ${{ matrix.profile }}

  node-current:
    name: Supported / Required Node / ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['26', 'node']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package:check
