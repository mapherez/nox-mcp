name: Contract compatibility

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Reject generated contract drift
        run: npm run contracts:check
      - name: Test TypeScript contracts and existing behavior
        run: npm test
      - name: Test Go contracts and existing behavior
        run: go test -mod=readonly ./...
      - name: Test Rust contracts and existing behavior
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Verify standalone native dependencies
        run: npm run test:native-packages
      - name: Verify installed TypeScript package
        run: npm run package:check
