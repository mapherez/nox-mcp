name: Supported / Required compatibility

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-mcp-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'NoX-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs

  conformance:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Supported / Required conformance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts
      - name: Reject generated contract drift
        run: npm run contracts:check
      - run: npm run check:code
      - name: Test TypeScript contracts and existing behavior
        run: npm test
      - name: Test Go contracts and existing behavior
        run: go test -mod=readonly ./...
      - name: Detect Go races in authorization, cache and execution
        if: runner.os == 'Linux'
        run: go test -race -mod=readonly ./...
      - name: Test Rust contracts and existing behavior
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Compare actual runtime observations across languages
        run: npm run test:conformance
      - name: Compare Suite contracts, cryptography and Gateway composition across languages
        run: npm run test:suite
      - name: Measure conventional and incremental discovery payloads
        run: npm run benchmark:discovery
      - name: Verify standalone native dependencies
        run: npm run test:native-packages
      - name: Verify installed TypeScript package
        run: npm run package:check
      - name: Require stdio and HTTP JSON in all SDKs, plus SSE in TypeScript/Rust
        run: npm run test:discovery

  independent-consumers:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Supported / Required consumer / ${{ matrix.language }} / ${{ matrix.profile }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [minimum, latest]
        language: [rust, go, typescript]
        include:
          - os: macos-latest
            profile: latest
            language: rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.profile == 'minimum' && '24.0.0' || '24' }}
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.profile == 'minimum' && '1.26.0' || '1.26.x' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.profile == 'minimum' && '1.88.0' || 'stable' }}
          components: rustfmt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Test independent native application and SDK, including Suite runtime
        if: matrix.language != 'typescript'
        run: node scripts/check-consumers.mjs
        env:
          NOX_CONSUMER_LANGUAGE: ${{ matrix.language }}
          NOX_CONSUMER_PROFILE: ${{ matrix.profile }}
      - name: Install tarball, compile consuming TS app and test HTTP JSON/SSE
        if: matrix.language == 'typescript'
        run: npm run package:check
        env:
          NOX_CONSUMER_PROFILE: ${{ matrix.profile }}

  node-current:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Supported / Required Node / ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["26", "node"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package:check

  formatting:
    name: Formatting
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run test:format

  approved:
    name: CI approved
    needs: [plan, policy, conformance, independent-consumers, node-current, formatting]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
