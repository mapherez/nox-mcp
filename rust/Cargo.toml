[package]
name = "nox-mcp"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Native MCP tools and cancellable request brokers for NoX applications"

[dependencies]
jsonschema = { version = "0.58", default-features = false }
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
base64 = "0.23.1"
ryu-js = "1"
tokio = { version = "1.43.0", features = ["macros", "sync", "time", "rt"] }
tokio-util = { version = "0.7.16", features = ["rt"] }

[dev-dependencies]
axum = "0.8"
rmcp = { version = "3.5.0", default-features = false, features = ["client"] }
