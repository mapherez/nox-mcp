[package]
name = "nox-mcp"
version = "0.4.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Native MCP tools and cancellable request brokers for NoX applications"

[dependencies]
jsonschema = { version = "0.58", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rmcp = { version = "3.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
rmcp = { version = "3.0", default-features = false, features = ["client"] }
